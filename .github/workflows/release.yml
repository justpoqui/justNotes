# Builds justNotes for Windows and Linux and publishes it as a GitHub release whenever
# changes reach main. Installed copies find the new release (the "Update pending" button,
# File ▸ Updates) and install it when you click Install.
#
# Version numbers: the "version" in package.json gives the first two parts (1.0), and each
# release from main takes the next third part: 1.0.0, 1.0.1, 1.0.2, ...
# Pushes to other branches only run the checks (on Linux and Windows); nothing is published.
#
# The release is made as a hidden draft, both builds add their files to it, and only when
# both have succeeded is it published, so the app never sees a half-finished release.

name: Release

on:
  push:
    branches: [main, phase-1-file-engine]
    paths-ignore: ['**.md', 'build/icon-source.png']
  workflow_dispatch:

permissions:
  contents: write # to create the release and upload the files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # On other branches, also check that the installers build (they aren't published).
      - name: Try building the installers
        if: github.ref != 'refs/heads/main'
        run: |
          npm run build
          npx electron-builder ${{ matrix.os == 'windows-latest' && '--win nsis --x64' || '--linux AppImage deb --x64' }} --publish never
      - name: Keep the test installer for a few days
        if: github.ref != 'refs/heads/main' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test
          path: dist/*.exe
          retention-days: 5

  prepare:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the version number and the list of changes
      - name: Version number
        id: v
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          N=$(git tag --list "v$BASE.*" | grep -cE "^v$BASE\.[0-9]+$" || true)
          echo "version=$BASE.$N" >> "$GITHUB_OUTPUT"
          echo "Releasing $BASE.$N"
      - name: Release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "## What's new in justNotes $VERSION"
            echo
            if [ -f "build/release-notes-$VERSION.md" ]; then
              cat "build/release-notes-$VERSION.md"
            else
              LAST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
              if [ -n "$LAST" ]; then git log --no-merges --format='- %s' "$LAST"..HEAD; else git log --no-merges --format='- %s' -n 20; fi
            fi
            echo
            sed "s/{{VERSION}}/$VERSION/g" build/release-download.md
          } > release-notes.md
          cat release-notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # (a draft left over from a failed run is replaced)
          if gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then gh release delete "v$VERSION" --yes; fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "justNotes $VERSION" --notes-file release-notes.md

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux AppImage deb --x64 --arm64
          - os: windows-latest
            targets: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.targets }} --publish always

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
